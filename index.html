    {
      "@context": "https://schema.org",

      "name": "Munavwar Mini Calculator",

  <body>
    <header class="title">
      <h1>Mini Calculator</h1>
      <p><i>by Munavwar Shaik</i></p>
    </header>

    <main id="container" role="application" aria-label="Calculator">
      <div class="top">
        <button class="ac" onclick="clearDisplay()" aria-label="Clear display"><h2>Ac</h2></button>
        <input type="text" class="display" id="display" readonly aria-label="Calculator display" aria-live="polite">
      </div>

      <button class="box" onclick="appendValue('1')" aria-label="One"><h2>1</h2></button>
      <button class="box" onclick="appendValue('2')" aria-label="Two"><h2>2</h2></button>
      <button class="box" onclick="appendValue('3')" aria-label="Three"><h2>3</h2></button>
      <button class="green" onclick="appendValue('+')" aria-label="Plus"><h2>+</h2></button>

      <button class="box" onclick="appendValue('4')" aria-label="Four"><h2>4</h2></button>
      <button class="box" onclick="appendValue('5')" aria-label="Five"><h2>5</h2></button>
      <button class="box" onclick="appendValue('6')" aria-label="Six"><h2>6</h2></button>
      <button class="green" onclick="appendValue('-')" aria-label="Minus"><h2>-</h2></button>

      <button class="box" onclick="appendValue('7')" aria-label="Seven"><h2>7</h2></button>
      <button class="box" onclick="appendValue('8')" aria-label="Eight"><h2>8</h2></button>
      <button class="box" onclick="appendValue('9')" aria-label="Nine"><h2>9</h2></button>
      <button class="green" onclick="appendValue('*')" aria-label="Multiply"><h2>×</h2></button>

      <button class="red" onclick="deleteLast()" aria-label="Delete last digit"><h2>Del</h2></button>
      <button class="box" onclick="appendValue('0')" aria-label="Zero"><h2>0</h2></button>
      <button class="red" onclick="calculate()" aria-label="Calculate result"><h2>=</h2></button>
      <button class="green" onclick="appendValue('/')" aria-label="Divide"><h2>/</h2></button>
    </main>
